version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: candela_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: candela_rms
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/backups:/backups
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - candela_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: candela_redis
    ports:
      - "6379:6379"
    networks:
      - candela_network
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: candela_backend
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/candela_rms?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - candela_network
    volumes:
      - ./backend/uploads:/app/uploads
      - ./database/backups:/app/database/backups
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: candela_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - candela_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: candela_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - candela_network
    restart: unless-stopped

  backup:
    image: postgres:15
    container_name: candela_backup
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: candela_rms
    volumes:
      - ./database/backups:/backups
      - ./scripts/backup.sh:/backup.sh
    entrypoint: |
      sh -c "
      chmod +x /backup.sh &&
      crontab /backup.sh &&
      crond -f
      "
    depends_on:
      - postgres
    networks:
      - candela_network

volumes:
  postgres_data:
  redis_data:

networks:
  candela_network:
    driver: bridge