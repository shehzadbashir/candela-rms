name: Candela RMS - Complete CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly security scan on Sundays

env:
  NODE_VERSION: '18.x'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/candela_test
  JWT_SECRET: test-secret-for-ci
  NODE_ENV: test

jobs:
  # JOB 1: Security Scan
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true
      
      - name: Run npm audit
        run: |
          cd backend && npm audit --production
          cd ../frontend && npm audit --production
        continue-on-error: true

  # JOB 2: Lint & Format
  lint:
    name: 📝 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Install Backend Dependencies
        run: cd backend && npm ci
      
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci
      
      - name: Lint Backend
        run: cd backend && npm run lint --if-present
        continue-on-error: true
      
      - name: Lint Frontend
        run: cd frontend && npm run lint --if-present
        continue-on-error: true
      
      - name: Check Formatting
        run: |
          cd backend && npx prettier --check "src/**/*.js"
          cd ../frontend && npx prettier --check "src/**/*.{js,jsx,ts,tsx}"
        continue-on-error: true

  # JOB 3: Unit Tests
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: candela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install Dependencies
        run: cd backend && npm ci
      
      - name: Run Database Migrations
        run: cd backend && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      
      - name: Run Unit Tests
        run: cd backend && npm test --if-present
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
      
      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage
          flags: backend
        continue-on-error: true

  # JOB 4: Build & Test Frontend
  frontend:
    name: 🎨 Build Frontend
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Dependencies
        run: cd frontend && npm ci
      
      - name: Run Linter
        run: cd frontend && npm run lint --if-present
      
      - name: Build Application
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_WS_URL: ws://localhost:5000
      
      - name: Cache Build Output
        uses: actions/cache@v3
        with:
          path: frontend/.next
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}

  # JOB 5: Integration Tests
  integration:
    name: 🔄 Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: candela_test
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Start Backend Server
        run: |
          cd backend
          npm ci
          npx prisma migrate deploy
          npm start &
          sleep 10
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          NODE_ENV: test
          PORT: 5000
      
      - name: Run API Tests
        run: |
          cd backend
          npm run test:integration --if-present
        env:
          API_URL: http://localhost:5000

  # JOB 6: Docker Build & Push
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
      
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/candela-rms-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/candela-rms-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/candela-rms-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/candela-rms-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 7: Deploy to Staging
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    needs: [docker, integration]
    environment:
      name: staging
      url: https://staging.candelarms.com
    steps:
      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/candela-rms
            docker-compose pull
            docker-compose up -d
            docker system prune -f
      
      - name: Run Smoke Tests
        run: |
          curl -f https://staging.candelarms.com/health
          curl -f https://staging.candelarms.com/api/health

  # JOB 8: Create Release
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker, integration]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.0.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            LICENSE
            README.md

  # JOB 9: Deploy to Production
  deploy-production:
    name: 🌐 Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    environment:
      name: production
      url: https://candelarms.com
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/candela-rms
            docker-compose pull
            docker-compose up -d
            docker system prune -f
      
      - name: Notify Success
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Production deployment completed successfully!'
            })

  # JOB 10: Performance Monitoring
  performance:
    name: 📊 Performance Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    steps:
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://staging.candelarms.com
            https://staging.candelarms.com/pos
            https://staging.candelarms.com/dashboard
          budgetPath: .github/lighthouse/budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # JOB 11: Dependency Update Check
  deps-update:
    name: 📦 Check Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      
      - name: Check npm updates
        run: |
          cd backend
          npx npm-check-updates
          cd ../frontend
          npx npm-check-updates
      
      - name: Create Update PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update dependencies"
          title: "⬆️ Weekly Dependency Updates"
          body: |
            This PR updates dependencies to their latest versions.
            Automated by GitHub Actions weekly schedule.
          branch: deps/update-dependencies
          base: develop

  # FINAL STATUS CHECK
  all-checks-passed:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [security-scan, lint, unit-tests, frontend, integration, docker, performance]
    if: success()
    steps:
      - name: All tests passed
        run: echo "✅ All CI/CD checks passed successfully!"

  # FAILURE NOTIFICATION
  notify-failure:
    name: 📢 Notify Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [security-scan, lint, unit-tests, frontend, integration, docker, performance]
    steps:
      - name: Send Discord Notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ CI/CD Pipeline Failed!
            Repository: {{ EVENT_PAYLOAD.repository.full_name }}
            Branch: {{ GITHUB_REF }}
            Commit: {{ GITHUB_SHA }}
            URL: https://github.com/{{ GITHUB_REPOSITORY }}/actions/runs/{{ GITHUB_RUN_ID }}
      
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ❌ CI/CD Pipeline Failed - Candela RMS
          to: team@candelarms.com
          from: GitHub Actions
          body: |
            The CI/CD pipeline has failed.
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}